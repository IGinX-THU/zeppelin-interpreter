services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.3
    command: [ "milvus", "run", "standalone" ]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    links:
      - etcd
      - minio
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  zk:
    image: zookeeper

  iotdb:
    image: apache/iotdb:0.12.5
    networks:
      default:
        ipv4_address: 192.168.0.7

  iginx:
    build: .
    ports:
      - 6888:6888
    volumes:
      - ./model_cache:/root/.cache/huggingface/hub
      - ./cache:/app/cache
      - ./logs/iginx:/app/logs
      - ../../udf/udf_list:/app/udf_funcs/udf_list
      - ../../udf/api:/app/udf_funcs/python_scripts/api
      - ../../udf/default:/app/udf_funcs/python_scripts/default
    environment:
      zookeeperConnectionString: zk:2181
      storageEngineList: 192.168.0.7#6667#iotdb12#username=root#password=root#has_data=false#is_read_only=false
      HF_DATASETS_OFFLINE: 1
      HF_HUB_OFFLINE: 1
      MILVUS_HOST: milvus
      LLM_CHAT_COMPLETIONS_URL: https://open.bigmodel.cn/api/paas/v4/chat/completions
      LLM_CHAT_COMPLETIONS_KEY: 10bc3e2b57b34fc6803a2275c82d9a01.Z2i5U5D29w8PPws7
      LLM_CHAT_COMPLETIONS_MODEL: GLM-4-Plus
    links:
      - zk
      - iotdb
      - milvus

  iginx-init:
    build:
      dockerfile: Dockerfile.init
    environment:
      IGINX_HOST: iginx
    links:
      - iginx
    restart: on-failure

  zeppelin:
    image: apache/zeppelin:0.8.2
    ports:
      - 8080:8080
    volumes:
      - ../../v8/target/zeppelin8-iginx-0.7.2-shaded.jar:/zeppelin/interpreter-iginx-only/iginx/zeppelin8-iginx-shaded.jar
      - ./notebook:/zeppelin/notebook
#      - ./logs/zepplin:/zeppelin/logs
      - ./resources/interpreter.json:/zeppelin/conf/interpreter.json
    environment:
      ZEPPELIN_ADDR: 0.0.0.0
      ZEPPELIN_INTERPRETER_DIR: /zeppelin/interpreter-iginx-only
      ZEPPELIN_IN_DOCKER: true
    entrypoint: /zeppelin/bin/zeppelin.sh
    links:
      - iginx
      - milvus

networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 192.168.0.0/24
